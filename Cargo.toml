[workspace]
resolver = "2"
members = [
    "crates/hanzo-crypto",
    "crates/hanzo-did",
    "crates/hanzo-message-primitives",
    "crates/hanzo-config",
    "crates/hanzo-guard",
    "crates/hanzo-extract",
    "crates/hanzo-agent",
    "crates/hanzo-agent-proxy",
    "crates/hanzo-agent-marketplace",
    "crates/hanzo-mcp-core",
    "crates/hanzo-mcp-client",
    "crates/hanzo-mcp-server",
    "crates/hanzo-mcp",
    "crates/hanzo-agents",
    "crates/hanzo-embedding",
    "crates/hanzo-kbs",
    "crates/hanzo-client",
    "examples",
]

[workspace.package]
version = "1.1.21"
edition = "2021"
authors = ["Hanzo AI <dev@hanzo.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hanzoai/rust-sdk"
homepage = "https://hanzo.ai"
rust-version = "1.88"

[workspace.dependencies]
# Async + serialization
tokio = { version = "1.45", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Crypto
blake3 = "1.8"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2.1"
hpke = "0.12"
sha2 = "0.10"
sha3 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
oqs = "0.11"
saorsa-pqc = "0.3"

# MCP
rmcp = { version = "0.8", features = ["client", "server", "macros", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-sse-client-reqwest"] }

# Math (used by hanzo-embedding for cosine similarity etc.)
rand = "0.8"

# Time / utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
base64 = "0.22"
hex = "0.4"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
once_cell = "1.21"
lazy_static = "1.5"
regex = "1"
walkdir = "2"
dirs = "5.0"
tempfile = "3.19"
home = "0.5"
os_path = "0.8"
csv = "1.3"
keyphrases = "0.3"
strip-ansi-escapes = "0.2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
warp = "0.3"

# Rate limiting
governor = "0.10"

# HTTP / API
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-gzip"] }
utoipa = "4.2"

# Dev
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.0"
tokio-test = "0.4"

# Internal workspace crates
hanzo-pqc = "1.1.22"  # canonical PQC — github.com/hanzoai/pqc
hanzo-client = { version = "0.1.0", path = "./crates/hanzo-client" }
hanzo-crypto = { version = "1.1.21", path = "./crates/hanzo-crypto" }
hanzo-did = { version = "1.1.21", path = "./crates/hanzo-did" }
hanzo-message-primitives = { version = "1.1.21", path = "./crates/hanzo-message-primitives" }
hanzo-config = { version = "1.1.21", path = "./crates/hanzo-config" }
hanzo-guard = { version = "0.1.4", path = "./crates/hanzo-guard" }
hanzo-extract = { version = "0.1.0", path = "./crates/hanzo-extract" }
hanzo-embedding = { version = "1.1.21", path = "./crates/hanzo-embedding" }
hanzo-kbs = { version = "1.1.21", path = "./crates/hanzo-kbs" }
hanzo-mcp-core = { version = "1.1.21", path = "./crates/hanzo-mcp-core" }
hanzo-mcp-client = { version = "1.1.21", path = "./crates/hanzo-mcp-client" }
hanzo-mcp-server = { version = "1.1.21", path = "./crates/hanzo-mcp-server" }
hanzo-mcp = { version = "1.1.21", path = "./crates/hanzo-mcp" }
hanzo-agent = { version = "1.1.21", path = "./crates/hanzo-agent" }
hanzo-agent-proxy = { version = "1.1.21", path = "./crates/hanzo-agent-proxy" }
hanzo-agent-marketplace = { version = "1.1.21", path = "./crates/hanzo-agent-marketplace" }
hanzo-agents = { version = "1.1.21", path = "./crates/hanzo-agents" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Lints: project style choices that clippy flags but we accept.
# Anything else: fix at the call site, not here.
[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
# API + naming
new_without_default = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
inherent_to_string = "allow"
borrowed_box = "allow"
ptr_arg = "allow"
module_inception = "allow"
enum_variant_names = "allow"
upper_case_acronyms = "allow"
new_ret_no_self = "allow"
result_unit_err = "allow"

# Style choices
uninlined_format_args = "allow"
redundant_field_names = "allow"
needless_return = "allow"
let_and_return = "allow"
single_match = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"
match_like_matches_macro = "allow"
nonminimal_bool = "allow"
needless_question_mark = "allow"
redundant_pattern_matching = "allow"
field_reassign_with_default = "allow"
derivable_impls = "allow"
single_component_path_imports = "allow"
map_entry = "allow"
assertions_on_constants = "allow"
while_let_on_iterator = "allow"

# Micro-perf / conversion patterns
redundant_clone = "allow"
clone_on_copy = "allow"
unnecessary_to_owned = "allow"
unnecessary_lazy_evaluations = "allow"
useless_conversion = "allow"
useless_format = "allow"
vec_init_then_push = "allow"
manual_map = "allow"
format_push_string = "allow"
unnecessary_unwrap = "allow"
needless_borrows_for_generic_args = "allow"
op_ref = "allow"
explicit_auto_deref = "allow"
from_over_into = "allow"
wrong_self_convention = "allow"
trivially_copy_pass_by_ref = "allow"
copy_iterator = "allow"
trim_split_whitespace = "allow"

# Comparison preferences
len_without_is_empty = "allow"
len_zero = "allow"
bool_comparison = "allow"
