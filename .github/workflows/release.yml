name: Publish
# Publishing a crate = pushing the tag `<crate>-v<semver>`. The tag names the
# crate and it names the version; nothing else votes. One crate per tag, so N
# crates is N tags — which is exactly what lets `hanzo-client` release on the
# spec's cadence while the hand-written crates release on their own.
#
# What died here, and why:
#   · the four hard-coded `publish_<crate>` booleans (20 `echo`s to decide one
#     string) — the tag already carries the crate name;
#   · the workspace-wide `v*` tag that published three crates at once — a second
#     way to do the one thing this file does, and it ran `cd crates/hanzo-pqc`,
#     a directory deleted from this workspace. It could not have succeeded again;
#   · the 5-target build matrix — `cargo publish` verifies by building the packed
#     .crate, which is a stronger gate than building the working tree, and the
#     `test:` block in hanzo.yml already gates every commit that reaches a tag;
#   · git-cliff, the gh-pages docs deploy and the Slack notify — none of them is
#     "put this crate on crates.io", and each was its own failure surface between
#     a green build and a published crate.
#
# `ubuntu-latest`, not the arc pool: measured 2026-08-01, hanzoai/js-sdk's publish
# job requested `hanzo-build-linux-amd64`, was never assigned a runner, sat 24h
# and was cancelled — and that release reached npm only because a human ran
# `npm publish` by hand. A publish that cannot be scheduled is a car that cannot
# move. Image builds still belong on the arc pool; this packs a tarball.

on:
  push:
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish — its Cargo.toml version is the version'
        required: true
        type: string

concurrency:
  # Never cancel a publish. crates.io does not take anything back, so a cancelled
  # run is indistinguishable from a run that half happened.
  group: publish-${{ github.event.inputs.crate || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Read the crate and the version out of the tag
        id: what
        # A workflow_dispatch has no tag, so the manifest is the version. A tag
        # has both, and they must agree — a tag naming a version the manifest
        # does not hold would publish something other than what it says.
        run: |
          set -euo pipefail
          CRATE='${{ github.event.inputs.crate }}'
          TAG_VERSION=''
          if [ -z "$CRATE" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            CRATE="${TAG%-v*}"
            TAG_VERSION="${TAG##*-v}"
          fi
          MANIFEST="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg c "$CRATE" '.packages[] | select(.name == $c) | .version')"
          [ -n "$MANIFEST" ] || { echo "::error::no crate named $CRATE in this workspace"; exit 1; }
          if [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" != "$MANIFEST" ]; then
            echo "::error::tag says $CRATE $TAG_VERSION, Cargo.toml says $MANIFEST"
            exit 1
          fi
          echo "crate=$CRATE"      >> "$GITHUB_OUTPUT"
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "publishing $CRATE $MANIFEST"

      - name: Pack
        # Packing before the registry check is what makes the check meaningful:
        # it produces the exact bytes crates.io would store, so "already there"
        # is answered by digest rather than by name.
        run: cargo package -p '${{ steps.what.outputs.crate }}'

      - name: Already published?
        id: exists
        # Idempotence, stated as a rule: a version that exists with OUR digest is
        # success — re-running the same tag is a no-op, which is what makes a
        # resumable release possible. A version that exists with a DIFFERENT
        # digest is a hard failure, because someone published out of band and the
        # tag no longer describes what a consumer receives.
        run: |
          set -euo pipefail
          CRATE='${{ steps.what.outputs.crate }}'
          VERSION='${{ steps.what.outputs.version }}'
          OURS="$(sha256sum "target/package/$CRATE-$VERSION.crate" | cut -d' ' -f1)"
          echo "ours=$OURS" >> "$GITHUB_OUTPUT"
          THEIRS="$(curl -sS -H 'User-Agent: hanzo-release (dev@hanzo.ai)' \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION" | jq -r '.version.checksum // empty')"
          if [ -z "$THEIRS" ]; then
            echo "done=false" >> "$GITHUB_OUTPUT"
          elif [ "$THEIRS" = "$OURS" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "$CRATE $VERSION is already on crates.io with this exact digest — nothing to do"
          else
            echo "::error::$CRATE $VERSION is on crates.io with digest $THEIRS, but this tag packs $OURS"
            exit 1
          fi

      - name: Publish
        if: steps.exists.outputs.done == 'false'
        # No --no-verify. The verification build compiles the packed .crate as a
        # consumer receives it, which is the only build that proves the uploaded
        # thing works — a working tree can compile while the package is missing
        # a file the tree happened to have.
        run: cargo publish -p '${{ steps.what.outputs.crate }}'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Prove it from outside
        # The receipt is what crates.io says, not what cargo said. Poll the public
        # API until the version is there and its checksum is the one we packed.
        run: |
          set -euo pipefail
          CRATE='${{ steps.what.outputs.crate }}'
          VERSION='${{ steps.what.outputs.version }}'
          for _ in $(seq 1 30); do
            THEIRS="$(curl -sS -H 'User-Agent: hanzo-release (dev@hanzo.ai)' \
              "https://crates.io/api/v1/crates/$CRATE/$VERSION" | jq -r '.version.checksum // empty')"
            if [ "$THEIRS" = '${{ steps.exists.outputs.ours }}' ]; then
              echo "crates.io serves $CRATE $VERSION at $THEIRS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::crates.io never served $CRATE $VERSION with our digest"
          exit 1
