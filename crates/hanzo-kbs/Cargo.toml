[package]
name = "hanzo-kbs"
description = "Hanzo AI - Key Broker Service (KMS + attestation + post-quantum vault)"
license.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hanzo-kbs"
keywords = ["kms", "kbs", "attestation", "pqc", "tee"]
categories = ["cryptography", "authentication"]

[features]
default = ["pqc"]
pqc = ["hanzo-pqc"]
# CI-specific feature to enable integration tests
integration-tests = ["pqc"]

[dependencies]
# Core dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
log = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }

# Cryptography
hpke = { workspace = true }
chacha20poly1305 = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core", "serde"] }
blake3 = { workspace = true }
hex = { workspace = true }

# For attestation
base64 = { workspace = true }
bincode = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

# Hanzo dependencies
hanzo-pqc = { workspace = true, optional = true }

# API dependencies
warp = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }

[lints]
workspace = true
