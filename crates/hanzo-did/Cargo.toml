[package]
name = "hanzo-did"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "W3C Decentralized Identifiers (DID) support for Hanzo ecosystem"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
regex = { workspace = true }
url = "2.5"
multibase = "0.9"
multihash = "0.19"
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

# Ethereum compatibility removed — ethers-rs unmaintained. Use alloy in
# consumers if you need EVM types.
# IPFS support removed — ipfs-api-backend-hyper transitively pulls yanked
# core2 0.4.0 via multihash 0.17.

[features]
default = []

[dev-dependencies]
tokio-test = { workspace = true }
[lints]
workspace = true
